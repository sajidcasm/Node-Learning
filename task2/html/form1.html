<!DOCTYPE html>
<html>
<head>
    <title>Simple Form</title>
</head>
<body>

    <h2>User Form</h2>

    <form action="/submit" method="POST">

        <label>Name</label>
        <br>

        <input
            type="text"
            name="name"
            placeholder="Enter Name"
        >

        <br><br>

        <label>Email</label>
        <br>

        <input
            type="email"
            name="email"
            placeholder="Enter Email"
        >

        <br><br>

        <button type="submit">
            Submit
        </button>

    </form>

</body>
</html>
