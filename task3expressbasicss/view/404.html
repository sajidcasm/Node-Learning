<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            font-family: Arial, sans-serif;
            background: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .error-code {
            font-size: 80px;
            font-weight: bold;
            color: #ef4444;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 15px;
            color: #1f2937;
        }

        p {
            color: #6b7280;
            margin-bottom: 25px;
            font-size: 18px;
        }

        a {
            text-decoration: none;
            background: #2563eb;
            color: white;
            padding: 12px 25px;
            border-radius: 6px;
            display: inline-block;
        }

        a:hover {
            background: #1d4ed8;
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="error-code">
            404
        </div>

        <h1>Page Not Found</h1>

        <p>
            Sorry, the page you are looking for does not exist.
        </p>

        <a href="/">
            Go Back Home
        </a>

    </div>

</body>
</html>
